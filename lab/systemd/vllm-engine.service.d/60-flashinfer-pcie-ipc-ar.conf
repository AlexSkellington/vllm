# 2026-10-31: FlashInfer PCIe CUDA-IPC all-reduce for SMALL batches only (lab patch /opt/vllm/apply_vllm_pcieipc_cap.py
# adds VLLM_PCIE_IPC_MAX_TOKENS; re-apply after any vLLM upgrade, or delete this drop-in).
# Measured ABBA (A=CUSTOM->PYNCCL): single-stream decode 118.1 -> 122.1 tok/s (+3.4%), 1 stream +7.4%, 2 streams +4.6%,
# 4 streams +2.1%; 8-32 streams and prefill unchanged (they exceed 12 tokens and keep the old path); KV pool unchanged.
# Uncapped it lost 2-3% at 8-32 streams. 12 tokens = 4 streams x (1 + 2 MTP drafts).
[Service]
Environment=VLLM_ALLREDUCE_USE_FLASHINFER_PCIE_IPC=1
Environment=VLLM_PCIE_IPC_MAX_TOKENS=12
