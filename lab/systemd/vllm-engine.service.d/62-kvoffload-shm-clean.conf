# 2026-11-10: the CPU KV tier is a /dev/shm region (16 GiB) that vLLM only unlinks on a clean shutdown. A leftover one
# fills /dev/shm and the next start crash-loops. Only one engine runs here and it is not running at ExecStartPre.
[Service]
ExecStartPre=/bin/sh -c 'rm -f /dev/shm/vllm_offload_*.mmap'
